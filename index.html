<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="max-age=0, no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Fly Express — معاك في كل طريق</title>
<meta name="theme-color" content="#070b12">

<link rel="icon" href="icon-512.png"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- مكتبة EmailJS لإرسال كود الـ OTP الفعلي للإيميل -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
  (function() {
     emailjs.init("qCOA0R-3vwqk0fiJ1");
  })();
</script>

<!-- ربط Firebase لتسجيل الدخول وحسابات Google -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyApqKjD46xobFTyBXY4lXRVZttnLGZxO98",
    authDomain: "flyexpress-a0f5a.firebaseapp.com",
    projectId: "flyexpress-a0f5a",
    storageBucket: "flyexpress-a0f5a.firebasestorage.app",
    messagingSenderId: "1053055752719",
    appId: "1:1053055752719:web:97ae05aa117ffbf6e8617a",
    measurementId: "G-G6HXPVWH6V"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  window.firebaseAuth = auth;
  window.firebaseFns = { signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup };
</script>

<style>
:root {
  --primary: #e11d48;
  --primary-gradient: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
  --surface: rgba(15, 23, 42, 0.75);
  --text-main: #f8fafc;
  --text-sub: #cbd5e1;
  --border: rgba(255, 255, 255, 0.12);
  font-family: 'Cairo', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
input, textarea { user-select: auto; outline: none; }
body { background-color: #030712; display: flex; justify-content: center; min-height: 100vh; color: var(--text-main); }

.mobile-frame {
  width: 100%; max-width: 430px; background-color: #090d16;
  background-image: linear-gradient(180deg, rgba(9, 13, 22, 0.45) 0%, rgba(9, 13, 22, 0.85) 100%), url('https://raw.githubusercontent.com/mahmoudahmed3531-lgtm/FlyExpress/main/1789048683343.jpg');
  background-position: center top; background-repeat: no-repeat; background-size: cover; background-attachment: fixed;
  min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-bottom: 85px; overflow-x: hidden;
}

.top-nav-bar { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
.location-selector { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.loc-icon { color: var(--primary); font-size: 18px; }
.loc-text { font-size: 10px; color: var(--text-sub); }
.loc-title { font-size: 13px; font-weight: 800; color: #fff; }

.ui-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 14px; backdrop-filter: blur(12px); }
.custom-field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(19, 27, 46, 0.9); font-family: inherit; font-size: 13px; margin-bottom: 10px; color: #fff; }
.custom-field:focus { border-color: var(--primary); }
.primary-action-btn { width: 100%; background: var(--primary); color: #fff; border: 0; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 900; font-family: inherit; cursor: pointer; box-shadow: 0 6px 18px rgba(225,29,72,0.4); }

.sub-page-view { display: none; padding: 16px; }
.sub-page-view.active { display: block; }
.tab-bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 430px; margin: 0 auto; height: 68px; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
.tab-btn { background: transparent; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); font-size: 11px; font-weight: 800; font-family: inherit; cursor: pointer; flex: 1; }
.tab-btn.active { color: var(--primary); }

.auth-overlay { position: fixed; inset: 0; max-width: 430px; margin: 0 auto; background: #090d16; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px 20px; color: #fff; overflow-y: auto; }
.auth-card-box { position: relative; z-index: 2; width: 100%; max-width: 360px; text-align: center; }
.auth-main-logo { width: 110px; height: 110px; border-radius: 28px; box-shadow: 0 0 35px rgba(225, 29, 72, 0.6); margin-bottom: 12px; border: 2px solid var(--primary); object-fit: cover; background: #0b0f19; }
.auth-nav-tabs { display: flex; gap: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.auth-tab-btn { flex: 1; padding: 10px; border: 0; border-radius: 10px; background: transparent; color: #cbd5e1; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
.auth-tab-btn.active { background: var(--primary); color: #fff; }
.google-auth-btn { width: 100%; padding: 12px; background: #ffffff; color: #1e293b; border: 0; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; }
</style>
</head>

<body>

<div class="mobile-frame">

  <!-- شاشة المصادقة وتسجيل الحساب -->
  <div class="auth-overlay" id="authGateScreen">
    <div class="auth-card-box">
      <img src="icon-512.png" alt="Fly Express Logo" class="auth-main-logo">
      <h2 style="font-size:24px; font-weight:900; margin-bottom:4px; font-style:italic;">FLY <span style="color:var(--primary);">EXPRESS</span></h2>
      <p style="font-size:12px; color:#cbd5e1; margin-bottom:18px;">معاك في كل طريق — أسرع وأأمن توصيل 🚀</p>

      <div class="auth-nav-tabs">
        <button class="auth-tab-btn active" id="btnTabLogin" onclick="switchAuthMode('login')">تسجيل الدخول</button>
        <button class="auth-tab-btn" id="btnTabSignup" onclick="switchAuthMode('signup')">تسجيل جديد</button>
      </div>

      <!-- نموذج تسجيل الدخول -->
      <form id="loginFormSection" onsubmit="event.preventDefault(); processLoginAction();">
        <input type="text" id="loginUsername" class="custom-field" placeholder="اسم المستخدم أو البريد">
        <input type="password" id="loginPassword" class="custom-field" placeholder="كلمة المرور">
        <button type="submit" class="primary-action-btn">تسجيل الدخول 🚀</button>
      </form>

      <!-- نموذج التسجيل وإرسال كود الـ OTP الفعلي لجيميل المستخدم -->
      <form id="signupFormSection" style="display:none;" onsubmit="event.preventDefault(); processSendRealOtp();">
        <input type="text" id="signupFullname" class="custom-field" placeholder="الاسم الكريم" required>
        <input type="tel" id="signupPhoneNum" class="custom-field" placeholder="رقم الهاتف للتواصل" required>
        <input type="email" id="signupEmailVal" class="custom-field" placeholder="البريد الإلكتروني (Gmail لاستلام الكود)" required>
        <input type="password" id="signupPasscode" class="custom-field" placeholder="كلمة المرور (6 أحرف فأكثر)" required>
        <button type="submit" class="primary-action-btn" id="btnSendOtp">إرسال كود الـ OTP إلى إيميلك 📨</button>
      </form>

      <!-- شاشة إدخال كود الـ OTP اليدوي المبعوث للإيميل -->
      <div id="verifyCodeSection" style="display:none;">
        <p style="font-size:12px; color:#10b981; margin-bottom:10px;">تم إرسال رسالة بها كود التحقق (OTP) إلى بريدك الإلكتروني! تفقد صندوق الوارد أو الـ Spam وادخل الكود هنا:</p>
        <input type="text" id="enteredOtpCode" class="custom-field" placeholder="أدخل الكود المكون من 4 أرقام" style="text-align:center; font-size:18px; letter-spacing:4px;" maxlength="4">
        <button type="button" class="primary-action-btn" style="background:#10b981;" onclick="verifyRealOtpCode()">تأكيد الكود وإنشاء الحساب ✨</button>
      </div>

      <!-- زر متابعة بحساب Google -->
      <button type="button" class="google-auth-btn" onclick="handleGoogleSignInDirect()" style="margin-top:14px;">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>متابعة باستخدام حساب Google</span>
      </button>
    </div>
  </div>

  <header class="top-nav-bar">
    <div class="location-selector" onclick="alert('نجع حمادي وقراها 📍')">
      <i class="fa-solid fa-location-dot loc-icon"></i>
      <div><div class="loc-text">موقعك الحالي</div><div class="loc-title">نجع حمادي وقراها ▾</div></div>
    </div>
  </header>

  <main id="view-home" class="sub-page-view active" style="padding-top:20px;">
    <div class="ui-card" style="text-align:center;">
      <h3 style="font-size:18px; font-weight:900; margin-bottom:8px;">أهلاً بك في Fly Express 🚀</h3>
      <p style="font-size:12px; color:#cbd5e1;">تم تسجيل الدخول وتفعيل الحساب بنجاح!</p>
    </div>
  </main>

  <nav class="tab-bottom-nav">
    <button class="tab-btn active" onclick="switchNavTab('home', this)"><i class="fa-solid fa-house" style="font-size:18px;"></i><span>الرئيسية</span></button>
  </nav>

</div>

<script>
let generatedOtpCode = "";
let pendingUserData = {};

function switchAuthMode(mode) {
  const isLogin = mode === 'login';
  document.getElementById('btnTabLogin').classList.toggle('active', isLogin);
  document.getElementById('btnTabSignup').classList.toggle('active', !isLogin);
  document.getElementById('loginFormSection').style.display = isLogin ? 'block' : 'none';
  document.getElementById('signupFormSection').style.display = isLogin ? 'none' : 'block';
  document.getElementById('verifyCodeSection').style.display = 'none';
}

function processLoginAction() {
  localStorage.setItem('fly_user_name', document.getElementById('loginUsername').value.trim() || 'عميل');
  initializeUserSession();
}

// توليد وإرسال الكود الفعلي عبر EmailJS للبريد المدخل
function processSendRealOtp() {
  const name = document.getElementById('signupFullname').value.trim();
  const phone = document.getElementById('signupPhoneNum').value.trim();
  const email = document.getElementById('signupEmailVal').value.trim();
  const pass = document.getElementById('signupPasscode').value.trim();
  
  if (!name || !phone || !email || !email.includes('@')) {
    alert("يرجى كتابة كافة البيانات وإدخال بريد صحيح.");
    return;
  }
  if (pass.length < 6) {
    alert("كلمة المرور يجب ألا تقل عن 6 أحرف أو أرقام.");
    return;
  }

  pendingUserData = { name, phone, email, pass };
  generatedOtpCode = Math.floor(1000 + Math.random() * 9000).toString(); // كود عشوائي من 4 أرقام

  const btn = document.getElementById('btnSendOtp');
  btn.textContent = "جاري إرسال الكود لجيميلك... ⏳";
  btn.disabled = true;

  // إرسال البيانات باستخدام المفاتيح التي أمددتنا بها
  const templateParams = {
    to_email: email,
    to_name: name,
    otp_code: generatedOtpCode
  };

  emailjs.send("service_xylpe3a", "template_4ovzrts", templateParams)
    .then(function(response) {
       btn.textContent = "إرسال كود الـ OTP إلى إيميلك 📨";
       btn.disabled = false;
       document.getElementById('signupFormSection').style.display = 'none';
       document.getElementById('verifyCodeSection').style.display = 'block';
       alert(`تم إرسال كود التحقق بنجاح إلى البريد (${email}). تفقد بريدك (وصندوق الـ Spam) لنسخ الكود وإدخاله.`);
    }, function(error) {
       btn.textContent = "إرسال كود الـ OTP إلى إيميلك 📨";
       btn.disabled = false;
       alert("حدث خطأ أثناء إرسال الإيميل، يرجى التأكد من قالب EmailJS وأنه يحتوي على المتغير {{otp_code}}.");
    });
}

// التحقق من الكود المدخل يدويًا
function verifyRealOtpCode() {
  const enteredCode = document.getElementById('enteredOtpCode').value.trim();
  if (enteredCode === generatedOtpCode) {
    localStorage.setItem('fly_user_name', pendingUserData.name);
    localStorage.setItem('fly_user_phone', pendingUserData.phone);
    localStorage.setItem('fly_user_email', pendingUserData.email);
    
    initializeUserSession();
    alert("✨ تم التحقق من الكود بنجاح وتفعيل حسابك في Fly Express!");
  } else {
    alert("❌ كود التحقق غير صحيح، يرجى مراجعة بريدك وإعادة كتابة الكود بدقة.");
  }
}

async function handleGoogleSignInDirect() {
  try {
    const provider = new window.firebaseFns.GoogleAuthProvider();
    const result = await window.firebaseFns.signInWithPopup(window.firebaseAuth, provider);
    const user = result.user;
    localStorage.setItem('fly_user_name', user.displayName || 'عميل Google');
    localStorage.setItem('fly_user_email', user.email);
    initializeUserSession();
    alert(`أهلاً بك يا ${user.displayName || 'عميل'} بحساب Google! 🚀`);
  } catch (error) {
    alert("خطأ في تسجيل Google: " + error.message);
  }
}

function initializeUserSession() {
  document.getElementById('authGateScreen').style.display = 'none';
}

function showView(viewId) { document.querySelectorAll('.sub-page-view').forEach(v => v.classList.remove('active')); document.getElementById(viewId).classList.add('active'); window.scrollTo(0, 0); }
function switchNavTab(tabName, btn) { showView('view-' + tabName); }

window.addEventListener('load', () => {
  if (localStorage.getItem('fly_user_name')) initializeUserSession();
});
</script>
</body>
</html>
