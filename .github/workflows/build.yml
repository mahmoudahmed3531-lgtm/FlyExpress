name: Build Signed Client APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Signed Client Project
        run: |
          cordova create client_app com.flyexpress.app "Fly Express"
          cd client_app
          cordova platform add android
          
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-geolocation
          
          mkdir -p res
          # تحميل الشعار الجديد الفخم بدقة عالية ليكون أيقونة التطبيق الرسمية
          curl -L -o res/icon.png "https://raw.githubusercontent.com/mahmoudahmed3531-lgtm/FlyExpress/main/icon-512.png" || cp ../icon-512.png res/icon.png

          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.flyexpress.app" version="1.0.7" xmlns="http://www.w3.org/ns/widgets">
              <name>Fly Express</name>
              <description>Fly Express Delivery Naga Hammadi</description>
              <content src="https://mahmoudahmed3531-lgtm.github.io/FlyExpress/index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-intent href="tel:*" />
              <allow-intent href="sms:*" />
              <allow-intent href="whatsapp:*" />
              <allow-navigation href="*" />
              <icon src="res/icon.png" />
              <preference name="CameraUsesGeolocation" value="false" />
          </widget>
          EOF

          # بناء الحزمة
          cordova build android --release --no-telemetry -- --packageType=apk

          # مفتاح التوقيع
          keytool -genkey -v -keystore flyexpress.jks -alias flyexpress -keyalg RSA -keysize 2048 -validity 10000 -storepass fly123456 -keypass fly123456 -dname "CN=FlyExpress, OU=Delivery, O=Fly, L=NagaHammadi, ST=Qena, C=EG"

          # المحاذاة والتوقيع الرسمي
          UNSIGNED_APK=$(find platforms/android -name "*release-unsigned.apk" | head -n 1)
          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk
          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner sign --ks flyexpress.jks --ks-pass pass:fly123456 --key-pass pass:fly123456 --out FlyExpress-Official.apk aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyExpress-Official-Signed-APK
          path: client_app/FlyExpress-Official.apk