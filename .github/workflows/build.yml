name: Build Client APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Client App Project
        run: |
          cordova create client_app com.flyexpress.app "Fly Express"
          cd client_app
          cordova platform add android
          
          # تثبيت إضافات الكاميرا والموقع
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-geolocation
          
          # إنشاء مجلد res أولاً ثم نسخ الأيقونة داخله
          mkdir -p res
          if [ -f ../icon-512.png ]; then
            cp ../icon-512.png res/icon.png
          elif [ -f ../icon-192.png ]; then
            cp ../icon-192.png res/icon.png
          fi

          # إعداد ملف التهيئة والأذونات والأيقونة
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.flyexpress.app" version="1.0.4" xmlns="http://www.w3.org/ns/widgets">
              <name>Fly Express</name>
              <description>Fly Express Delivery Naga Hammadi</description>
              <content src="https://mahmoudahmed3531-lgtm.github.io/FlyExpress/index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-intent href="tel:*" />
              <allow-intent href="sms:*" />
              <allow-intent href="whatsapp:*" />
              <allow-navigation href="*" />
              <icon src="res/icon.png" />
              <preference name="CameraUsesGeolocation" value="false" />
          </widget>
          EOF

          cordova build android --debug

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyExpress-Client-Live-APK
          path: client_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk