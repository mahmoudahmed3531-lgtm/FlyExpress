name: Build Fullscreen APK

    on:
      workflow_dispatch:

    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Set up Java
            uses: actions/setup-java@v3
            with:
              distribution: 'temurin'
              java-version: '17'

          - name: Generate Android Project
            run: |
              mkdir -p app/src/main/java/com/flyexpress/app
              mkdir -p app/src/main/res/mipmap-xxxhdpi
              mkdir -p app/src/main/res/values

              # نسخ الأيقونة الأصلية إلى التطبيق
              if [ -f "icon-512.png" ]; then
                cp icon-512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              elif [ -f "icon-192.png" ]; then
                cp icon-192.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              fi

              cat << 'EOF' > settings.gradle
              include ':app'
              EOF

              cat << 'EOF' > build.gradle
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                  }
                  dependencies {
                      classpath 'com.android.tools.build:gradle:8.1.4'
                  }
              }
              allprojects {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              EOF

              cat << 'EOF' > app/build.gradle
              plugins {
                  id 'com.android.application'
              }
              android {
                  namespace 'com.flyexpress.app'
                  compileSdk 34
                  defaultConfig {
                      applicationId "com.flyexpress.app"
                      minSdk 21
                      targetSdk 34
                      versionCode 2
                      versionName "1.1"
                  }
                  buildTypes {
                      debug {
                          minifyEnabled false
                      }
                  }
              }
              EOF

              cat << 'EOF' > app/src/main/AndroidManifest.xml
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.INTERNET"/>
                  <application
                      android:label="Fly Express"
                      android:icon="@mipmap/ic_launcher"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                      android:usesCleartextTraffic="true">
                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:configChanges="orientation|screenSize">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN"/>
                              <category android:name="android.intent.category.LAUNCHER"/>
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
              EOF

              cat << 'EOF' > app/src/main/java/com/flyexpress/app/MainActivity.java
              package com.flyexpress.app;

              import android.app.Activity;
              import android.content.Intent;
              import android.net.Uri;
              import android.os.Bundle;
              import android.view.View;
              import android.webkit.WebSettings;
              import android.webkit.WebView;
              import android.webkit.WebViewClient;

              public class MainActivity extends Activity {
                  private WebView webView;

                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      webView = new WebView(this);
                      
                      // تفعيل التمرير السلس واللمس
                      webView.setScrollBarStyle(View.SCROLLBARS_INSIDE_OVERLAY);
                      webView.setOverScrollMode(View.OVER_SCROLL_ALWAYS);
                      webView.setVerticalScrollBarEnabled(false);
                      webView.setHorizontalScrollBarEnabled(false);

                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setUseWideViewPort(true);
                      settings.setLoadWithOverviewMode(true);

                      webView.setWebViewClient(new WebViewClient() {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, String url) {
                              if (url.startsWith("whatsapp://") || url.contains("api.whatsapp.com") || url.contains("wa.me") || url.startsWith("tel:")) {
                                  try {
                                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                      startActivity(intent);
                                      return true;
                                  } catch (Exception e) {
                                      return false;
                                  }
                              }
                              return false;
                          }
                      });

                      setContentView(webView);
                      webView.loadUrl("https://mahmoudahmed3531-lgtm.github.io/FlyExpress/");
                  }

                  @Override
                  public void onBackPressed() {
                      if (webView.canGoBack()) {
                          webView.goBack();
                      } else {
                          super.onBackPressed();
                      }
                  }
              }
              EOF

          - name: Setup Gradle
            uses: gradle/actions/setup-gradle@v3
            with:
              gradle-version: '8.5'

          - name: Build APK with Gradle
            run: gradle :app:assembleDebug

          - name: Upload Clean APK
            uses: actions/upload-artifact@v4
            with:
              name: FlyExpress-Clean-APK
              path: app/build/outputs/apk/debug/*.apk