name: Build Client APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Client App Project
        run: |
          cordova create client_app com.flyexpress.app "Fly Express"
          cd client_app
          cordova platform add android
          # إضافة إضافات صلاحيات الكاميرا والوسائط والموقع في الأندرويد
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-geolocation
          # ضبط الرابط المباشر
          echo '<widget id="com.flyexpress.app" version="1.0.3" xmlns="http://www.w3.org/ns/widgets"><name>Fly Express</name><description>Fly Express Delivery</description><content src="https://mahmoudahmed3531-lgtm.github.io/FlyExpress/index.html" /><access origin="*" /><allow-navigation href="*" /><preference name="CameraUsesGeolocation" value="false" /></widget>' > config.xml
          cordova build android --debug

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyExpress-Client-Live-APK
          path: client_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk