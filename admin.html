<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Fly Express — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root { --bg-dark: #070b12; --surface: #0f172a; --primary: #e11d48; --text-main: #f8fafc; --text-sub: #94a3b8; --border: rgba(255, 255, 255, 0.08); font-family: 'Cairo', sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: var(--bg-dark); color: var(--text-main); padding: 16px; }
.admin-container { max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
.admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.admin-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
.btn-action { width: 100%; border: 0; cursor: pointer; padding: 12px; border-radius: 12px; font-weight: 800; font-family: inherit; font-size: 13px; margin-top: 8px; }
.btn-action:active { transform: scale(0.98); }
.admin-input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: #070b12; color: #fff; font-family: inherit; font-size: 12px; outline: none; margin-bottom: 8px; }
.admin-input:focus { border-color: var(--primary); }
</style>
</head>
<body>

<div class="admin-login-overlay" id="adminLoginGate" style="position: fixed; inset: 0; background: #070b12; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div class="login-card" style="background: var(--surface); border: 1.5px solid var(--primary); border-radius: 24px; padding: 24px 20px; width: 100%; max-width: 340px; text-align: center;">
    <div style="font-size: 42px; color: var(--primary); margin-bottom: 8px;"><i class="fa-solid fa-user-shield"></i></div>
    <h2 style="font-size: 18px; font-weight: 900; margin-bottom: 4px;">دخول الإدارة</h2>
    <input type="text" id="adminUserVal" class="admin-input" placeholder="اسم المستخدم (Fly)">
    <input type="password" id="adminPassVal" class="admin-input" placeholder="كلمة المرور (096)">
    <button class="btn-action" style="background:var(--primary); color:#fff;" onclick="verifyAdminCredentials()">تسجيل الدخول 🚀</button>
  </div>
</div>

<div class="admin-container" id="adminMainContent" style="display:none;">
  <div class="admin-header">
    <div style="display:flex; align-items:center; gap:10px;">
      <i class="fa-solid fa-tower-broadcast" style="font-size:22px; color:var(--primary);"></i>
      <div>
        <h2 style="font-size:16px; font-weight:900;">لوحة تحكم Fly</h2>
        <span style="font-size:10px; color:#10b981;">🟢 وضع الإرسال القوي مفعل</span>
      </div>
    </div>
    <button onclick="adminLogout()" style="background:transparent; border:0; color:#ef4444; font-size:12px; font-weight:800; cursor:pointer;">خروج</button>
  </div>

  <!-- القسم الجديد: إرسال إشعارات مباشرة للمستخدمين -->
  <div class="admin-card" style="border-color: #3b82f6; background: rgba(59, 130, 246, 0.05);">
    <h3 style="font-size:14px; font-weight:900; color:#3b82f6; margin-bottom:8px;"><i class="fa-solid fa-bell"></i> إرسال إشعار مباشر للعميل</h3>
    <p style="font-size:10px; color:var(--text-sub); margin-bottom:10px;">يظهر كرسالة منبثقة داخل تطبيق العميل فوراً وبدون الحاجة لواتساب.</p>
    <input type="text" id="notifyClientUid" class="admin-input" placeholder="كود حساب العميل (مثال: FLY-010-8475)">
    <select id="notifyMsgSelect" class="admin-input">
      <option value="تم توصيل الطالب بسلام ✅">تم توصيل الطالب للمدرسة/المنزل بسلام ✅</option>
      <option value="الكابتن وصل، يرجى الاستلام 🛵">الكابتن وصل الموقع، يرجى الاستلام 🛵</option>
      <option value="تم تسليم الأوردر بنجاح 🍔">تم تسليم الأوردر الخاص بك بنجاح 🍔</option>
      <option value="عذراً، الكابتن تأخر بسبب الزحام وسيصل قريباً 🚦">الكابتن متأخر قليلاً بسبب الزحام 🚦</option>
    </select>
    <button class="btn-action" style="background:#3b82f6; color:#fff;" onclick="sendDirectAppNotification()">إرسال الإشعار للعميل 🔔</button>
  </div>

  <div class="admin-card" style="border-color: #c084fc; background: rgba(192, 132, 252, 0.05);">
    <h3 style="font-size:14px; font-weight:900; color:#c084fc; margin-bottom:8px;"><i class="fa-solid fa-crown"></i> تفعيل باقة FLY PASS للعميل</h3>
    <input type="text" id="targetClientUid" class="admin-input" placeholder="كود حساب العميل">
    <select id="subDaysSelect" class="admin-input">
      <option value="30">اشتراك شهر كامل (30 يوم)</option>
      <option value="7">فترة تجريبية (7 أيام)</option>
    </select>
    <button class="btn-action" style="background:#c084fc; color:#fff;" onclick="activateClientSub()">تفعيل الباقة للعميل الآن 👑</button>
  </div>

  <div class="admin-card" style="border-color: #f59e0b;">
    <h3 style="font-size:14px; font-weight:900; color:#f59e0b; margin-bottom:10px;"><i class="fa-solid fa-toggle-on"></i> حالة التطبيق للإعلانات والصيانة</h3>
    <label style="font-size:11px; color:var(--text-sub);">شريط الإعلان اليومي:</label>
    <input type="text" id="dailyNoticeInput" class="admin-input" value="🔥 عرض اليوم: توصيل الطلاب بـ 5 جنيه فقط لفترة محدودة!">
    <button class="btn-action" style="background:#f59e0b; color:#000; margin-bottom:12px;" onclick="sendNoticeCommand()">نشر الإعلان فوراً 📢</button>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; border-top:1px solid rgba(255,255,255,0.1); padding-top:12px;">
       <button class="btn-action" style="background:#10b981; color:#fff; margin-top:0;" onclick="sendMaintenanceCommand('open')">فتح التطبيق 🟢</button>
       <button class="btn-action" style="background:#ef4444; color:#fff; margin-top:0;" onclick="sendMaintenanceCommand('closed')">إغلاق صيانة ⛔</button>
    </div>
  </div>

  <div class="admin-card" style="border-color: #0ea5e9; background: rgba(14, 165, 233, 0.05);">
    <h3 style="font-size:14px; font-weight:900; color:#0ea5e9; margin-bottom:8px;"><i class="fa-solid fa-cloud-arrow-down"></i> إرسال تحديث إجباري للتطبيق</h3>
    <input type="text" id="apkDownloadLink" class="admin-input" placeholder="رابط الـ APK (مثال: Mediafire link)">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
      <button class="btn-action" style="background:#0ea5e9; color:#fff;" onclick="sendForceUpdate(true)">إرسال التحديث 🚀</button>
      <button class="btn-action" style="background:transparent; border:1px solid #0ea5e9; color:#0ea5e9;" onclick="sendForceUpdate(false)">إلغاء التحديث 🔓</button>
    </div>
  </div>

  <div class="admin-card" style="border-color: #8b5cf6; background: rgba(139, 92, 246, 0.05);">
    <h3 style="font-size:14px; font-weight:900; color:#8b5cf6; margin-bottom:8px;"><i class="fa-solid fa-rotate"></i> تحديث الواجهة (بدون مسح بيانات العميل)</h3>
    <button class="btn-action" style="background:#8b5cf6; color:#fff;" onclick="forceAppRefresh()">تحديث واجهة العملاء الآن 🔄</button>
  </div>
</div>

<script>
const TOPIC = "flyexpress_super_admin_2026";
let currentState = { service: "open", notice: "", update_lock: false, apk_link: "" };

window.addEventListener('load', () => {
  if (sessionStorage.getItem('fly_admin_session') === 'true') showDashboard();
});

function verifyAdminCredentials() {
  if (document.getElementById('adminUserVal').value.trim() === 'Fly' && document.getElementById('adminPassVal').value.trim() === '096') {
    sessionStorage.setItem('fly_admin_session', 'true');
    showDashboard();
  } else {
    document.getElementById('loginErrorTxt').style.display = 'block';
  }
}

function showDashboard() {
  document.getElementById('adminLoginGate').style.display = 'none';
  document.getElementById('adminMainContent').style.display = 'block';
}
function adminLogout() { sessionStorage.removeItem('fly_admin_session'); location.reload(); }

function sendPayloadToApp(payload, successMsg) {
  const xhr = new XMLHttpRequest();
  xhr.open("POST", `https://ntfy.sh/${TOPIC}?_t=${Date.now()}`, true);
  xhr.onload = function() {
    if (xhr.status >= 200 && xhr.status < 300) alert(successMsg);
    else alert("⚠️ تم الإرسال.");
  };
  xhr.onerror = function() { alert("❌ فشل الإرسال! تأكد من الإنترنت."); };
  xhr.send(JSON.stringify(payload));
}

// دالة إرسال الإشعار المباشر للعميل
function sendDirectAppNotification() {
  const uid = document.getElementById('notifyClientUid').value.trim();
  const msg = document.getElementById('notifyMsgSelect').value;
  if(!uid) return alert("⚠️ يرجى إدخال كود العميل أولاً!");
  
  const payload = { action: "direct_msg", target_uid: uid, msg: msg, time: Date.now() };
  sendPayloadToApp(payload, "✅ تم إرسال الإشعار لتطبيق العميل بنجاح!");
  document.getElementById('notifyClientUid').value = ""; // مسح الكود بعد الإرسال
}

function sendNoticeCommand() {
  currentState.notice = document.getElementById('dailyNoticeInput').value.trim();
  currentState.time = Date.now();
  sendPayloadToApp(currentState, "✅ تم نشر الإعلان بنجاح!");
}
function sendMaintenanceCommand(status) {
  currentState.service = status; currentState.time = Date.now();
  sendPayloadToApp(currentState, status === 'closed' ? "⛔ تم إغلاق التطبيق للصيانة!" : "🟢 تم فتح التطبيق للعملاء.");
}
function sendForceUpdate(isLocked) {
  currentState.update_lock = isLocked;
  if(isLocked) currentState.apk_link = document.getElementById('apkDownloadLink').value.trim();
  currentState.time = Date.now();
  sendPayloadToApp(currentState, isLocked ? "🚀 تم إرسال أمر التحديث الإجباري!" : "🔓 تم إلغاء شاشة التحديث.");
}
function forceAppRefresh() {
  if(!confirm("سيتم عمل ريفرش لواجهة العملاء، متأكد؟")) return;
  sendPayloadToApp({ force_reload_id: Date.now() }, "✅ تم أمر التحديث للواجهة!");
}
function activateClientSub() {
  const uid = document.getElementById('targetClientUid').value.trim();
  const days = parseInt(document.getElementById('subDaysSelect').value);
  if(!uid) return alert("⚠️ يرجى إدخال كود العميل!");
  sendPayloadToApp({ action: "activate_sub", target_uid: uid, days: days, time: Date.now() }, "✅ تم إرسال أمر التفعيل بنجاح!");
  document.getElementById('targetClientUid').value = ""; 
}
</script>
</body>
</html>
