<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Fly Express — لوحة تحكم الإدارة</title>
<meta name="theme-color" content="#070b12">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --bg-dark: #070b12;
  --surface: #0f172a;
  --primary: #ff6b00;
  --accent: #00e5ff;
  --success: #10b981;
  --danger: #ef4444;
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
  --border: rgba(255, 255, 255, 0.08);
  font-family: 'Cairo', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body {
  background-color: var(--bg-dark);
  color: var(--text-main);
  padding: 16px;
  min-height: 100vh;
}
.admin-container {
  max-width: 480px;
  margin: 0 auto;
}

.admin-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 16px;
}

.admin-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}

.btn-action {
  width: 100%;
  border: 0;
  cursor: pointer;
  padding: 12px;
  border-radius: 12px;
  font-weight: 800;
  font-family: inherit;
  font-size: 13px;
  margin-top: 8px;
}

/* Toggle Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 52px;
  height: 28px;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer; inset: 0;
  background-color: #374151;
  transition: .3s;
  border-radius: 28px;
}
.slider:before {
  position: absolute; content: "";
  height: 20px; width: 20px; left: 4px; bottom: 4px;
  background-color: white;
  transition: .3s;
  border-radius: 50%;
}
input:checked + .slider { background-color: var(--danger); }
input:checked + .slider:before { transform: translateX(24px); }

.admin-input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12);
  background: #070b12;
  color: #fff;
  font-family: inherit;
  font-size: 12px;
  outline: none;
  resize: vertical;
}
</style>
</head>

<body>
<div class="admin-container">

  <div class="admin-header">
    <div style="display:flex; align-items:center; gap:10px;">
      <i class="fa-solid fa-shield-halved" style="font-size:24px; color:var(--primary);"></i>
      <h2 style="font-size:18px; font-weight:900;">لوحة تحكم Fly Express</h2>
    </div>
    <a href="index.html" style="color:var(--text-sub); text-decoration:none; font-size:12px; font-weight:800;">
      <i class="fa-solid fa-arrow-left"></i> رجوع
    </a>
  </div>

  <!-- 1. كارت قفل التطبيق للصيانة والتحديث -->
  <div class="admin-card" style="border-color: var(--danger); background: rgba(239, 68, 68, 0.05);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <i class="fa-solid fa-screwdriver-wrench" style="color:var(--danger); font-size:18px;"></i>
        <h3 style="font-size:15px; font-weight:900; color:var(--danger);">وضع قفل التطبيق للتحديث</h3>
      </div>
      <label class="switch">
        <input type="checkbox" id="maintenanceToggle">
        <span class="slider"></span>
      </label>
    </div>
    <p style="font-size:11px; color:var(--text-sub); margin-bottom:10px;">
      تفعيل هذا الخيار يقفل شاشة تسجيل الدخول في تطبيق العملاء فوراً ويمنعهم من الدخول ويعرض رسالة التحديث.
    </p>
    
    <label style="font-size:11px; font-weight:800; color:#cbd5e1; display:block; margin-bottom:4px;">رسالة التحديث التي ستظهر للعميل:</label>
    <textarea id="maintenanceCustomMsg" class="admin-input" rows="3" placeholder="مثال: يوجد تحديث وتحسينات جارية للتطبيق حالياً.. سنعود للعمل خلال دقائق 🛠️"></textarea>
    
    <button class="btn-action" style="background:var(--danger); color:#fff;" onclick="broadcastMaintenanceState()">
      <i class="fa-solid fa-tower-broadcast"></i> حفظ وبث حالة القفل لجميع الهواتف 📡
    </button>
  </div>

  <!-- 2. رادار الأمان اليومي -->
  <div class="admin-card">
    <h3 style="font-size:15px; font-weight:900; color:#34d399; margin-bottom:10px;">
      <i class="fa-solid fa-shield-halved"></i> تحديث رادار أمان رحلة المدارس
    </h3>
    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px;">
      <button class="btn-action" style="background:#1e293b; color:#fff;" onclick="setRadarStep(1)">1. استلام 🏠</button>
      <button class="btn-action" style="background:#1e293b; color:#fff;" onclick="setRadarStep(2)">2. في الطريق 🛵</button>
      <button class="btn-action" style="background:#1e293b; color:#fff;" onclick="setRadarStep(3)">3. وصل بسلام 🏫</button>
    </div>
  </div>

  <!-- 3. حالة استقبال الطلبات العامة -->
  <div class="admin-card">
    <h3 style="font-size:15px; font-weight:900; color:var(--primary); margin-bottom:10px;">
      <i class="fa-solid fa-toggle-on"></i> حالة خدمة التوصيل
    </h3>
    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px;">
      <button class="btn-action" style="background:rgba(16, 185, 129, 0.2); color:#34d399; border:1px solid #10b981;" onclick="setServiceStatus('online')">متاح 🟢</button>
      <button class="btn-action" style="background:rgba(245, 158, 11, 0.2); color:#fbbf24; border:1px solid #f59e0b;" onclick="setServiceStatus('busy')">مشغول 🟡</button>
      <button class="btn-action" style="background:rgba(239, 68, 68, 0.2); color:#f87171; border:1px solid #ef4444;" onclick="setServiceStatus('offline')">مغلق 🔴</button>
    </div>
  </div>

</div>

<script>
const CLOUD_CHANNEL = "https://ntfy.sh/flyexpress_live_sync_nagahammadi_2026";

// استرجاع الإعدادات المحفوظة
window.addEventListener('load', () => {
  const savedMaint = localStorage.getItem('fly_app_maintenance');
  if (savedMaint) {
    const data = JSON.parse(savedMaint);
    document.getElementById('maintenanceToggle').checked = data.isLocked || false;
    document.getElementById('maintenanceCustomMsg').value = data.message || "";
  }
});

async function broadcastData(payload) {
  try {
    const res = await fetch(CLOUD_CHANNEL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      alert("✅ تم إرسال التحديث بنجاح إلى جميع الأجهزة المشتركة!");
    } else {
      alert("⚠️ حدث خطأ في الخادم أثناء الإرسال.");
    }
  } catch (e) {
    alert("❌ تعذر الاتصال بالسيرفر السحابي، تحقق من الإنترنت.");
  }
}

async function broadcastMaintenanceState() {
  const isLocked = document.getElementById('maintenanceToggle').checked;
  const message = document.getElementById('maintenanceCustomMsg').value.trim() || "يوجد تحديث وتحسينات جارية للتطبيق حالياً.. سنعود قريباً 🛠️";

  const maintObj = { isLocked, message, updatedAt: Date.now() };
  localStorage.setItem('fly_app_maintenance', JSON.stringify(maintObj));

  const payload = {
    radar: parseInt(localStorage.getItem('fly_radar_step') || '1', 10),
    service: localStorage.getItem('fly_service_status') || 'online',
    maintenance: maintObj
  };

  await broadcastData(payload);
}

async function setRadarStep(step) {
  localStorage.setItem('fly_radar_step', step);
  const savedMaint = JSON.parse(localStorage.getItem('fly_app_maintenance') || '{"isLocked":false,"message":""}');
  const payload = {
    radar: step,
    service: localStorage.getItem('fly_service_status') || 'online',
    maintenance: savedMaint
  };
  await broadcastData(payload);
}

async function setServiceStatus(status) {
  localStorage.setItem('fly_service_status', status);
  const savedMaint = JSON.parse(localStorage.getItem('fly_app_maintenance') || '{"isLocked":false,"message":""}');
  const payload = {
    radar: parseInt(localStorage.getItem('fly_radar_step') || '1', 10),
    service: status,
    maintenance: savedMaint
  };
  await broadcastData(payload);
}
</script>
</body>
</html>
