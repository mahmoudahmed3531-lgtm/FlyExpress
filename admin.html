<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Fly Express — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root { --bg-dark: #070b12; --surface: #0f172a; --primary: #e11d48; --text-main: #f8fafc; --text-sub: #94a3b8; --border: rgba(255, 255, 255, 0.08); font-family: 'Cairo', sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: var(--bg-dark); color: var(--text-main); padding: 16px; }
.admin-container { max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
.admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.admin-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
.btn-action { width: 100%; border: 0; cursor: pointer; padding: 12px; border-radius: 12px; font-weight: 800; font-family: inherit; font-size: 13px; margin-top: 8px; }
.btn-action:active { transform: scale(0.98); }
.admin-input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: #070b12; color: #fff; font-family: inherit; font-size: 12px; outline: none; margin-bottom: 8px; }
.admin-input:focus { border-color: var(--primary); }
</style>
</head>
<body>

<div class="admin-login-overlay" id="adminLoginGate" style="position: fixed; inset: 0; background: #070b12; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div class="login-card" style="background: var(--surface); border: 1.5px solid var(--primary); border-radius: 24px; padding: 24px 20px; width: 100%; max-width: 340px; text-align: center;">
    <div style="font-size: 42px; color: var(--primary); margin-bottom: 8px;"><i class="fa-solid fa-user-shield"></i></div>
    <h2 style="font-size: 18px; font-weight: 900; margin-bottom: 4px;">دخول الإدارة</h2>
    <input type="text" id="adminUserVal" class="admin-input" placeholder="اسم المستخدم (Fly)">
    <input type="password" id="adminPassVal" class="admin-input" placeholder="كلمة المرور (096)">
    <button class="btn-action" style="background:var(--primary); color:#fff;" onclick="verifyAdminCredentials()">تسجيل الدخول 🚀</button>
  </div>
</div>

<div class="admin-container" id="adminMainContent" style="display:none;">
  <div class="admin-header">
    <div style="display:flex; align-items:center; gap:10px;">
      <i class="fa-solid fa-tower-broadcast" style="font-size:22px; color:var(--primary);"></i>
      <div>
        <h2 style="font-size:16px; font-weight:900;">لوحة تحكم Fly</h2>
        <span style="font-size:10px; color:#10b981;">🟢 البث المباشر متصل</span>
      </div>
    </div>
    <button onclick="adminLogout()" style="background:transparent; border:0; color:#ef4444; font-size:12px; font-weight:800; cursor:pointer;">خروج</button>
  </div>

  <!-- القسم الجديد: تفعيل الاشتراكات (مضاد للغش) -->
  <div class="admin-card" style="border-color: #c084fc; background: rgba(192, 132, 252, 0.05);">
    <h3 style="font-size:14px; font-weight:900; color:#c084fc; margin-bottom:8px;"><i class="fa-solid fa-crown"></i> تفعيل باقة FLY PASS للعميل</h3>
    <p style="font-size:10px; color:var(--text-sub); margin-bottom:10px;">انسخ كود العميل من رسالة الواتساب، والصقه هنا لتفعيل اشتراكه على جهازه فوراً وبأمان.</p>
    <input type="text" id="targetClientUid" class="admin-input" placeholder="كود حساب العميل (مثال: FLY-010-8475)">
    <select id="subDaysSelect" class="admin-input">
      <option value="30">اشتراك شهر كامل (30 يوم)</option>
      <option value="7">فترة تجريبية (7 أيام)</option>
    </select>
    <button class="btn-action" style="background:#c084fc; color:#fff;" onclick="activateClientSub()">
      <i class="fa-solid fa-check-circle"></i> تفعيل الباقة للعميل الآن 👑
    </button>
  </div>

  <div class="admin-card" style="border-color: #f59e0b;">
    <h3 style="font-size:14px; font-weight:900; color:#f59e0b; margin-bottom:10px;"><i class="fa-solid fa-toggle-on"></i> حالة التطبيق للعملاء</h3>
    <select id="appStatusSelect" class="admin-input" style="width:100%;">
      <option value="open">🟢 شغال ومستعد للطلبات</option>
      <option value="closed">🔴 مغلق مؤقتاً / صيانة</option>
    </select>
    <label style="font-size:11px; color:var(--text-sub);">شريط الإعلان اليومي:</label>
    <input type="text" id="dailyNoticeInput" class="admin-input" value="🔥 عرض اليوم: توصيل الطلاب بـ 5 جنيه فقط لفترة محدودة!">
    <button class="btn-action" style="background:#f59e0b; color:#000;" onclick="sendCommand()">
      <i class="fa-solid fa-bullhorn"></i> نشر العرض والحالة فوراً 📢
    </button>
  </div>

  <div class="admin-card" style="border-color: #e11d48; background: rgba(225, 29, 72, 0.05);">
    <h3 style="font-size:14px; font-weight:900; color:var(--primary); margin-bottom:8px;"><i class="fa-solid fa-cloud-arrow-up"></i> إجبار العملاء على التحديث</h3>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
      <button class="btn-action" style="background:#ef4444; color:#fff;" onclick="toggleLock(true)">قفل التطبيق 🔒</button>
      <button class="btn-action" style="background:#10b981; color:#fff;" onclick="toggleLock(false)">فتح التطبيق 🔓</button>
    </div>
  </div>

  <div class="admin-card" style="border-color: #8b5cf6; background: rgba(139, 92, 246, 0.05);">
    <h3 style="font-size:14px; font-weight:900; color:#8b5cf6; margin-bottom:8px;"><i class="fa-solid fa-rotate"></i> تحديث الواجهة (مسح الكاش)</h3>
    <button class="btn-action" style="background:#8b5cf6; color:#fff;" onclick="forceAppRefresh()">تحديث تطبيق العملاء الآن 🔄</button>
  </div>
</div>

<script>
const TOPIC = "flyexpress_control_naga_v99";
let isLocked = false;

window.addEventListener('load', () => {
  if (sessionStorage.getItem('fly_admin_session') === 'true') showDashboard();
});

function verifyAdminCredentials() {
  if (document.getElementById('adminUserVal').value.trim() === 'Fly' && document.getElementById('adminPassVal').value.trim() === '096') {
    sessionStorage.setItem('fly_admin_session', 'true');
    showDashboard();
  } else {
    document.getElementById('loginErrorTxt').style.display = 'block';
  }
}

function showDashboard() {
  document.getElementById('adminLoginGate').style.display = 'none';
  document.getElementById('adminMainContent').style.display = 'block';
}

function adminLogout() {
  sessionStorage.removeItem('fly_admin_session');
  location.reload();
}

async function sendCommand() {
  const payload = {
    service: document.getElementById('appStatusSelect').value,
    notice: document.getElementById('dailyNoticeInput').value.trim(),
    lock: isLocked,
    time: Date.now()
  };
  localStorage.setItem("fly_admin_cmd", JSON.stringify(payload));
  try {
    const res = await fetch(`https://ntfy.sh/${TOPIC}`, { method: 'POST', body: JSON.stringify(payload) });
    if(res.ok) alert("✅ تم النشر لجميع العملاء!");
  } catch(e) { alert("❌ تأكد من اتصال الإنترنت"); }
}

function toggleLock(state) { isLocked = state; sendCommand(); }

async function forceAppRefresh() {
  if(!confirm("سيتم تحديث التطبيق ومسح الكاش عند جميع العملاء الآن، هل أنت متأكد؟")) return;
  const payload = { force_reload_id: Date.now() };
  try {
    const res = await fetch(`https://ntfy.sh/${TOPIC}`, { method: 'POST', body: JSON.stringify(payload) });
    if(res.ok) alert("✅ تم إرسال أمر التحديث لجميع العملاء!");
  } catch(e) {}
}

// دالة تفعيل الاشتراك الخاصة بالعميل (الحماية العالية)
async function activateClientSub() {
  const uid = document.getElementById('targetClientUid').value.trim();
  const days = parseInt(document.getElementById('subDaysSelect').value);
  
  if(!uid) return alert("⚠️ يرجى إدخال كود العميل المرفق في رسالة الواتساب!");
  
  const payload = {
    action: "activate_sub",
    target_uid: uid,
    days: days,
    time: Date.now()
  };

  try {
    const res = await fetch(`https://ntfy.sh/${TOPIC}`, { method: 'POST', body: JSON.stringify(payload) });
    if(res.ok) {
      alert("✅ تم إرسال أمر التفعيل بنجاح! سيتم فتح الاشتراك في جهاز العميل فوراً.");
      document.getElementById('targetClientUid').value = ""; // تفريغ الخانة بعد الإرسال
    }
  } catch(e) {
    alert("❌ فشل الاتصال، تأكد من الإنترنت.");
  }
}
</script>
</body>
</html>
