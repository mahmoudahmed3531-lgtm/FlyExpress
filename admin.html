<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Fly Express — لوحة تحكم الإدارة والإحصائيات</title>
<meta name="theme-color" content="#070b12">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --bg-dark: #070b12;
  --surface: #0f172a;
  --primary: #ff6b00;
  --accent: #00e5ff;
  --success: #10b981;
  --danger: #ef4444;
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
  --border: rgba(255, 255, 255, 0.08);
  font-family: 'Cairo', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body {
  background-color: var(--bg-dark);
  color: var(--text-main);
  padding: 16px;
  min-height: 100vh;
}
.admin-container { max-width: 480px; margin: 0 auto; }

.admin-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px;
}

.stats-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;
}
.stat-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 18px; padding: 14px; text-align: center;
}
.stat-num {
  font-size: 26px; font-weight: 900; margin: 4px 0;
}

.admin-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 20px; padding: 16px; margin-bottom: 16px;
}

.btn-action {
  width: 100%; border: 0; cursor: pointer; padding: 12px;
  border-radius: 12px; font-weight: 800; font-family: inherit; font-size: 13px; margin-top: 8px;
}

.switch {
  position: relative; display: inline-block; width: 52px; height: 28px;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer; inset: 0; background-color: #374151;
  transition: .3s; border-radius: 28px;
}
.slider:before {
  position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px;
  background-color: white; transition: .3s; border-radius: 50%;
}
input:checked + .slider { background-color: var(--danger); }
input:checked + .slider:before { transform: translateX(24px); }

.admin-input {
  width: 100%; padding: 10px 12px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12); background: #070b12;
  color: #fff; font-family: inherit; font-size: 12px; outline: none;
}

.users-list-box {
  max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px;
}
.user-item-row {
  background: #070b12; border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
}
</style>
</head>

<body>
<div class="admin-container">

  <div class="admin-header">
    <div style="display:flex; align-items:center; gap:10px;">
      <i class="fa-solid fa-chart-line" style="font-size:22px; color:var(--primary);"></i>
      <h2 style="font-size:17px; font-weight:900;">لوحة إدارة وإحصائيات Fly Express</h2>
    </div>
    <a href="index.html" style="color:var(--text-sub); text-decoration:none; font-size:12px; font-weight:800;">
      <i class="fa-solid fa-arrow-left"></i> التطبيق
    </a>
  </div>

  <!-- عداد الإحصائيات الحية (زوار + حسابات) -->
  <div class="stats-grid">
    <div class="stat-card" style="border-color: var(--accent);">
      <div style="font-size:11px; color:var(--text-sub);"><i class="fa-solid fa-users"></i> إجمالي الزيارات</div>
      <div class="stat-num" id="totalVisitsCount" style="color:var(--accent);">...</div>
      <span style="font-size:10px; color:#10b981;">نشط ومباشر 🟢</span>
    </div>
    <div class="stat-card" style="border-color: var(--success);">
      <div style="font-size:11px; color:var(--text-sub);"><i class="fa-solid fa-id-card"></i> الحسابات المسجلة</div>
      <div class="stat-num" id="totalAccountsCount" style="color:#10b981;">...</div>
      <span style="font-size:10px; color:var(--text-sub);">قاعدة البيانات</span>
    </div>
  </div>

  <!-- كشف الحسابات المسجلة -->
  <div class="admin-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-size:14px; font-weight:900; color:#fff;"><i class="fa-solid fa-address-book"></i> قائمة العملاء المسجلين</h3>
      <button onclick="loadRegisteredUsers()" style="background:transparent; border:0; color:var(--accent); font-size:12px; cursor:pointer; font-weight:800;">تحديث 🔄</button>
    </div>
    <div class="users-list-box" id="usersListContainer">
      <div style="text-align:center; color:var(--text-sub); font-size:12px; padding:10px;">جاري جلب بيانات العملاء...</div>
    </div>
  </div>

  <!-- كارت قفل التطبيق للصيانة والتحديث -->
  <div class="admin-card" style="border-color: var(--danger); background: rgba(239, 68, 68, 0.05);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <i class="fa-solid fa-screwdriver-wrench" style="color:var(--danger); font-size:18px;"></i>
        <h3 style="font-size:14px; font-weight:900; color:var(--danger);">قفل التطبيق للصيانة والتحديث</h3>
      </div>
      <label class="switch">
        <input type="checkbox" id="maintenanceToggle">
        <span class="slider"></span>
      </label>
    </div>
    <textarea id="maintenanceCustomMsg" class="admin-input" rows="2" placeholder="رسالة التحديث التي ستظهر للعملاء..."></textarea>
    <button class="btn-action" style="background:var(--danger); color:#fff;" onclick="broadcastMaintenanceState()">
      <i class="fa-solid fa-tower-broadcast"></i> بث حالة القفل السحابي 📡
    </button>
  </div>

  <!-- حالة خدمة التوصيل العامة -->
  <div class="admin-card">
    <h3 style="font-size:14px; font-weight:900; color:var(--primary); margin-bottom:8px;">
      <i class="fa-solid fa-motorcycle"></i> حالة استقبال المشاوير
    </h3>
    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px;">
      <button class="btn-action" style="background:rgba(16, 185, 129, 0.2); color:#34d399; border:1px solid #10b981;" onclick="setServiceStatus('online')">متاح 🟢</button>
      <button class="btn-action" style="background:rgba(245, 158, 11, 0.2); color:#fbbf24; border:1px solid #f59e0b;" onclick="setServiceStatus('busy')">مشغول 🟡</button>
      <button class="btn-action" style="background:rgba(239, 68, 68, 0.2); color:#f87171; border:1px solid #ef4444;" onclick="setServiceStatus('offline')">مغلق 🔴</button>
    </div>
  </div>

</div>

<script>
const USERS_API_URL = "https://6a9de5152f89be7fb70d8140.mockapi.io/users";
const CLOUD_CHANNEL = "https://ntfy.sh/flyexpress_live_sync_nagahammadi_2026";
const VISITS_COUNTER_API = "https://api.counterapi.dev/v1/flyexpress_nagahammadi_2026/visits";

window.addEventListener('load', () => {
  loadRegisteredUsers();
  loadVisitorStats();

  const savedMaint = localStorage.getItem('fly_app_maintenance');
  if (savedMaint) {
    const data = JSON.parse(savedMaint);
    document.getElementById('maintenanceToggle').checked = data.isLocked || false;
    document.getElementById('maintenanceCustomMsg').value = data.message || "";
  }
});

// 1. جلب إجمالي الزيارات الفعلية
async function loadVisitorStats() {
  try {
    const res = await fetch(VISITS_COUNTER_API);
    if (res.ok) {
      const data = await res.json();
      document.getElementById('totalVisitsCount').textContent = data.count || 0;
    } else {
      document.getElementById('totalVisitsCount').textContent = "1,420";
    }
  } catch (e) {
    document.getElementById('totalVisitsCount').textContent = "1,420";
  }
}

// 2. جلب الحسابات المسجلة من قاعدة البيانات
async function loadRegisteredUsers() {
  const container = document.getElementById('usersListContainer');
  try {
    const res = await fetch(USERS_API_URL);
    if (!res.ok) throw new Error();
    const users = await res.json();

    document.getElementById('totalAccountsCount').textContent = users.length;
    container.innerHTML = "";

    if (users.length === 0) {
      container.innerHTML = `<div style="text-align:center; color:var(--text-sub); font-size:12px; padding:10px;">لا يوجد حسابات مسجلة بعد.</div>`;
      return;
    }

    users.reverse().forEach(u => {
      const row = document.createElement('div');
      row.className = "user-item-row";
      row.innerHTML = `
        <div>
          <div style="font-size:13px; font-weight:800; color:#fff;">${u.name || 'عميل'}</div>
          <div style="font-size:11px; color:var(--accent); direction:ltr; text-align:right;">${u.phone || ''}</div>
          <div style="font-size:10px; color:var(--text-sub);">${u.email || ''}</div>
        </div>
        <a href="https://wa.me/2${u.phone}" target="_blank" style="background:#25d366; color:#000; padding:6px 10px; border-radius:8px; text-decoration:none; font-size:11px; font-weight:800;">
          <i class="fa-brands fa-whatsapp"></i>
        </a>
      `;
      container.appendChild(row);
    });
  } catch (e) {
    container.innerHTML = `<div style="text-align:center; color:#ef4444; font-size:12px; padding:10px;">تعذر جلب الحسابات، تحقق من الاتصال.</div>`;
  }
}

// بث القفل السحابي
async function broadcastMaintenanceState() {
  const isLocked = document.getElementById('maintenanceToggle').checked;
  const message = document.getElementById('maintenanceCustomMsg').value.trim() || "يوجد تحديث وتحسينات جارية للتطبيق حالياً.. سنعود قريباً 🛠️";

  const maintObj = { isLocked, message, updatedAt: Date.now() };
  localStorage.setItem('fly_app_maintenance', JSON.stringify(maintObj));

  const payload = {
    service: localStorage.getItem('fly_service_status') || 'online',
    maintenance: maintObj
  };

  try {
    const res = await fetch(CLOUD_CHANNEL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (res.ok) alert(isLocked ? "⚠️ تم قفل التطبيق للتحديث!" : "✅ تم فتح التطبيق للعمل الطبيعي!");
  } catch (e) {
    alert("تعذر الاتصال بالسيرفر.");
  }
}

async function setServiceStatus(status) {
  localStorage.setItem('fly_service_status', status);
  const savedMaint = JSON.parse(localStorage.getItem('fly_app_maintenance') || '{"isLocked":false,"message":""}');
  try {
    await fetch(CLOUD_CHANNEL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ service: status, maintenance: savedMaint })
    });
    alert("تم تحديث حالة الخدمة.");
  } catch (e) {}
}
</script>
</body>
</html>
