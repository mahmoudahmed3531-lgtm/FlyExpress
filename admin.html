<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Fly Express — لوحة التحكم</title>
<meta name="theme-color" content="#070b12">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --bg-dark: #070b12;
  --surface: #0f172a;
  --primary: #e11d48;
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
  --border: rgba(255, 255, 255, 0.08);
  font-family: 'Cairo', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background-color: var(--bg-dark); color: var(--text-main); padding: 16px; min-height: 100vh; }
.admin-container { max-width: 480px; margin: 0 auto; }

.admin-login-overlay {
  position: fixed; inset: 0; background: #070b12; z-index: 99999;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.login-card {
  background: var(--surface); border: 1.5px solid var(--primary); border-radius: 24px;
  padding: 24px 20px; width: 100%; max-width: 340px; text-align: center;
}

.admin-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px;
}

.admin-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 20px; padding: 16px; margin-bottom: 16px;
}

.btn-action {
  width: 100%; border: 0; cursor: pointer; padding: 12px;
  border-radius: 12px; font-weight: 800; font-family: inherit; font-size: 13px; margin-top: 8px;
}
.btn-action:active { transform: scale(0.98); }

.admin-input {
  width: 100%; padding: 10px 12px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12); background: #070b12;
  color: #fff; font-family: inherit; font-size: 12px; outline: none; margin-bottom: 8px;
}
.admin-input:focus { border-color: var(--primary); }

.price-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.users-list-box { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.user-item-row {
  background: #070b12; border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
}
</style>
</head>

<body>

<div class="admin-login-overlay" id="adminLoginGate">
  <div class="login-card">
    <div style="font-size: 42px; color: var(--primary); margin-bottom: 8px;"><i class="fa-solid fa-user-shield"></i></div>
    <h2 style="font-size: 18px; font-weight: 900; margin-bottom: 4px;">تسجيل دخول الإدارة</h2>
    <p style="font-size: 11px; color: var(--text-sub); margin-bottom: 16px;">يرجى تأكيد الهوية للوصول للوحة التحكم</p>
    <div id="loginErrorTxt" style="display:none; color:#ef4444; font-size:11px; font-weight:800; margin-bottom:10px;">بيانات غير صحيحة!</div>
    <input type="text" id="adminUserVal" class="admin-input" placeholder="اسم المستخدم (Fly)">
    <input type="password" id="adminPassVal" class="admin-input" placeholder="كلمة المرور (096)">
    <button class="btn-action" style="background:var(--primary); color:#fff;" onclick="verifyAdminCredentials()">تسجيل الدخول 🚀</button>
  </div>
</div>

<div class="admin-container" id="adminMainContent" style="display:none;">

  <div class="admin-header">
    <div style="display:flex; align-items:center; gap:10px;">
      <i class="fa-solid fa-tower-broadcast" style="font-size:22px; color:var(--primary);"></i>
      <div>
        <h2 style="font-size:16px; font-weight:900;">لوحة تحكم Fly Express</h2>
        <span style="font-size:10px; color:#10b981;">🟢 النظام السحابي شغال</span>
      </div>
    </div>
    <button onclick="adminLogout()" style="background:transparent; border:0; color:#ef4444; font-size:12px; font-weight:800; cursor:pointer;">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> خروج
    </button>
  </div>

  <!-- 1. حالة التطبيق وشريط الإعلانات -->
  <div class="admin-card" style="border-color: #f59e0b;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="font-size:14px; font-weight:900; color:#f59e0b;"><i class="fa-solid fa-toggle-on"></i> حالة التطبيق للعملاء</h3>
      <select id="appStatusSelect" class="admin-input" style="width:auto; margin:0; padding:6px 10px;">
        <option value="open">🟢 شغال ومستعد للطلبات</option>
        <option value="closed">🔴 مغلق مؤقتاً / صيانة</option>
      </select>
    </div>

    <label style="font-size:11px; color:var(--text-sub);">شريط الإعلان اليومي في أعلى هاتف العميل:</label>
    <input type="text" id="dailyNoticeInput" class="admin-input" value="🔥 عرض اليوم: توصيل الطلاب بـ 5 جنيه فقط لفترة محدودة!">

    <button class="btn-action" style="background:#f59e0b; color:#000;" onclick="publishData()">
      <i class="fa-solid fa-bullhorn"></i> نشر العرض وحالة التطبيق فوراً 📢
    </button>
  </div>

  <!-- 2. قفل التطبيق للتحديث الإجباري -->
  <div class="admin-card" style="border-color: #e11d48; background: rgba(225, 29, 72, 0.05);">
    <h3 style="font-size:14px; font-weight:900; color:var(--primary); margin-bottom:8px;"><i class="fa-solid fa-cloud-arrow-up"></i> إجبار العملاء على التحديث</h3>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
      <button class="btn-action" style="background:#ef4444; color:#fff;" onclick="toggleLockState(true)">
        <i class="fa-solid fa-lock"></i> قفل التطبيق الآن 🔒
      </button>
      <button class="btn-action" style="background:#10b981; color:#fff;" onclick="toggleLockState(false)">
        <i class="fa-solid fa-lock-open"></i> فتح التطبيق 🔓
      </button>
    </div>
  </div>

  <!-- 3. قائمة الأسعار -->
  <div class="admin-card" style="border-color: #00e5ff;">
    <h3 style="font-size:14px; font-weight:900; color:#00e5ff; margin-bottom:8px;"><i class="fa-solid fa-tags"></i> أسعار المشاوير الحية</h3>
    <div class="price-row"><span style="font-size:12px;">داخل نجع حمادي:</span><input type="number" id="p_inside" class="admin-input" style="width:90px; margin:0;" value="30"></div>
    <div class="price-row"><span style="font-size:12px;">داخل قرية بركة:</span><input type="number" id="p_berka" class="admin-input" style="width:90px; margin:0;" value="20"></div>
    <button class="btn-action" style="background:#00e5ff; color:#000;" onclick="publishData()">
      <i class="fa-solid fa-share-from-square"></i> تحديث ونشر الأسعار 🏷️
    </button>
  </div>

</div>

<script>
let isLockedNow = false;

window.addEventListener('load', () => {
  if (sessionStorage.getItem('fly_admin_session') === 'true') {
    showDashboard();
  }
});

function verifyAdminCredentials() {
  const u = document.getElementById('adminUserVal').value.trim();
  const p = document.getElementById('adminPassVal').value.trim();
  if (u === 'Fly' && p === '096') {
    sessionStorage.setItem('fly_admin_session', 'true');
    showDashboard();
  } else {
    document.getElementById('loginErrorTxt').style.display = 'block';
  }
}

function showDashboard() {
  document.getElementById('adminLoginGate').style.display = 'none';
  document.getElementById('adminMainContent').style.display = 'block';
}

function adminLogout() {
  sessionStorage.removeItem('fly_admin_session');
  location.reload();
}

function publishData() {
  const payload = {
    service: document.getElementById('appStatusSelect').value,
    notice: document.getElementById('dailyNoticeInput').value.trim(),
    lock: isLockedNow,
    prices: {
      inside: parseInt(document.getElementById('p_inside').value || 30),
      berka: parseInt(document.getElementById('p_berka').value || 20)
    },
    t: Date.now()
  };

  // حفظ في الذاكرة المشتركة الفورية لتطبيق العميل
  localStorage.setItem("fly_master_cmd", JSON.stringify(payload));
  
  // حفظ بديل في خادم خارجي خفيف ومباشر لتلقي الأوامر
  fetch("https://kvdb.io/4yZ37X8YvY7W1jB3RkW5U1/fly_app_state", {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  }).catch(e => {});

  alert("✅ تم تنفيذ ونشر الأمر وتحديث التطبيق لحظياً عند كل العملاء!");
}

function toggleLockState(locked) {
  isLockedNow = locked;
  publishData();
}
</script>
</body>
</html>
